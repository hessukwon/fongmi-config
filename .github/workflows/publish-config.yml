name: Sync and publish FongMi config

on:
  workflow_dispatch:
  schedule:
    - cron: "19 */6 * * *"
  push:
    branches: [main]
    paths:
      - upstream.txt
      - scripts/sync_config.py
      - .github/workflows/publish-config.yml

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Fetch and validate upstream config
        run: python3 scripts/sync_config.py

      - name: Package Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
